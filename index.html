<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTE | Actividad 3. Documentación sobre la configuración de la interfaz de Blender </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #221F36;
            --violet: #5F4B8B;
            --light: #FCFAFA;
            --green: #6F9283;
            --red: #931621;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #2b2550, var(--bg));
            color: var(--light);
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 80px 20px 40px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero p {
            color: var(--green);
            margin-top: 10px;
        }

        .counter {
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* CARD */
        .card {
            background: rgba(95, 75, 139, 0.15);
            border: 1px solid rgba(95, 75, 139, 0.35);
            border-radius: 18px;
            padding: 20px;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--green);
        }

        /* 🔥 TITULOS MEJORADOS */
        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
            color: var(--light);

            padding: 8px 12px;
            border-radius: 10px;

            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .card h2::after {
            content: "";
            display: block;
            width: 40px;
            height: 2px;
            background: var(--violet);
            margin: 8px auto 0;
            border-radius: 2px;
            opacity: 0.7;
        }

        iframe {
            width: 100%;
            border-radius: 12px;
            border: none;
        }

        /* Shorts */
        .short iframe {
            height: 560px;
            max-width: 320px;
            margin: auto;
            display: block;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.9rem;
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Documentación sobre la configuración de la interfaz de Blender</h1>
        <p>VANTE · Emiliano Cervantes</p>
    </div>

    

    </div>

    <footer>
        VANTE · Documentación sobre la configuración de la interfaz de Blender · 2026
    </footer>

</body>

</html>
